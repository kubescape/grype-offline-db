name: Deploy a bundle including a Grype database

on:
  workflow_dispatch:
  schedule:
  - cron: '0 13 * * 1'

jobs:
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - uses: vmware-tanzu/carvel-setup-action@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        only: kbld, imgpkg
    - uses: buildpacks/github-actions/setup-pack@v6.2.2
    - uses: anchore/scan-action/download-grype@v7
    - name: Log in to the container registry
      uses: docker/login-action@v4
      with:
        registry: quay.io
        username: ${{ secrets.QUAYIO_REGISTRY_USERNAME }}
        password: ${{ secrets.QUAYIO_REGISTRY_PASSWORD }}
    - name: Build and deploy image
      run: make install
